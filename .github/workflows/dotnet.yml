# This workflow builds and tests the .NET project

name: .NET

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore src/backend/BlaChallenge.slnx

      - name: Build
        run: dotnet build src/backend/BlaChallenge.slnx --no-restore

      - name: Test
        run: dotnet test src/backend/BlaChallenge.slnx --no-build --verbosity normal
